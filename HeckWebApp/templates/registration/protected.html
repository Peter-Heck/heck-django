{% extends "base.html" %}
{% load static %}

{% block content %}
<form method="POST" action="{% url 'logout' %}">
	{% csrf_token %}
	<button id="logout-btn" type='submit'>Logout</button>
</form>

<section class="protected_profile_head">
	<div id="protected_name_div">
		<h2>{{profile.name}}</h2>
		<p id="edit_name_p"><a href="{% url 'edit_profile_name' %}">Edit Name</a></p>
	</div>

	<div class="bio_name">
		<div id="protected_image_div">
			<img src="{% static 'images/' %}{{profile.profilePic}}" alt="Profile picture for {{profile.name}}">
			<p id="edit_image_p"><a href="{% url 'edit_profile_image' %}">Edit Picture</a></p>
		</div>

		<div id="protected_bio_div">
			<p>{{profile.bio}}</p>
			<p id="edit_bio_p"><a href="{% url 'edit_profile_bio' %}">Edit Bio</a></p>
		</div>
	</div>
</section>

<section class="posts_section" id="protected_posts_section">
	<h2>Posts</h2>
	<form id="make_post_p" action="{% url 'make_post' %}">
		{% csrf_token %}
		<button type="submit">Make a Post</button>
	</form>
        <div class="container py-5">
                <div class="row">
                        {% include 'posts.html' %}
                </div>
        </div>
            
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
        </script>
</section>
{% endblock content %}

{% extends "base.html" %}
{% load static %}

{% block content %}
<section class="profile_head">
    <h2>{{user.name}}</h2>

    <div class="bio_name">
        <img src="{% static 'images/' %}{{user.profilePic}}" alt="Profile picture for {{user.name}}">
        <p>{{user.bio}}</p>
    </div>
</section>

<section class="posts_section" id="profile_posts_section">    
    <h2>Posts</h2>
        <div class="container py-5">
                <div class="row">
                        {% include 'posts.html' %}
                </div>
        </div>
            
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
        </script>
</section>

{% endblock content %}

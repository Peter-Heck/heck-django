{% extends "base.html" %}
{% load static %}

{% block content %}
<div id='index_users_section'>
        <button onclick="myFunction()" class="usersbtn">Users</button>
        <ul id="user_dropdown" class="user_dropdown_content">
                {% for user in users %}
                <li><img src="{% static 'images/' %}{{user.profilePic}}" alt="Profile picture for {{user.name}}"><p><a href="{% url 'profile' name=user.name %}">{{user.name}}</a></p></li>
                {% endfor %}
        </ul>
</div>

<section class='posts_section' id='index_posts_section'>
        <h2>Posts</h2>
        <div class="container py-5">
                <div class="row">
                        {% include 'posts.html' %}
                </div>
        </div>
            
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
        </script>
</section>
{% endblock content %}
